name: Carga Ministerio Publico → Supabase

on:
  schedule:
    # Roda todo dia às 22:30 horário de Brasília (01:30 UTC)
    - cron: '30 1 * * *'

  workflow_dispatch:  # Permite rodar manualmente pelo GitHub

jobs:
  carga-mp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar carga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          CAMINHO_DE_PARA: De_Para.xlsx
        run: python Carga_MInist_Publico_Supabase.py
