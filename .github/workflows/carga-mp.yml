name: Carga Ministerio Publico → Supabase

on:
  schedule:
    # Roda todo dia às 08:00 horário de Brasília (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Permite rodar manualmente pelo GitHub

jobs:
  carga-mp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install google-api-python-client google-auth pandas requests

      - name: Criar arquivo da Service Account
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Executar carga
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python Carga_MInist_Publico_Supabase.py --force

      - name: Limpar credenciais
        if: always()
        run: rm -f service_account.json
