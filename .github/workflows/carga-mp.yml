name: Carga Ministerio Publico → Supabase

on:
  schedule:
    # Roda todo dia às 21:30 horário de Brasília (00:30 UTC do dia seguinte)
    - cron: '30 1 * * *'
    
  workflow_dispatch:  # Permite rodar manualmente pelo GitHub

jobs:
  carga-mp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install gdown pandas requests

      - name: Executar carga
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python Carga_MInist_Publico_Supabase.py --force
